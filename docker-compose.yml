version: "3.9"
services:
  user-svc:
    build: 
      context: .
      dockerfile: services/user-svc/Dockerfile
    ports: ["50051:50051"]
    healthcheck:
      test: ["CMD", "bash", "-lc", "exec 3<>/dev/tcp/127.0.0.1/50051 && echo -e '\x00' >&3 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
    environment:
      - USER_SVC_ADDR=user-svc:50051
    ports: ["8080:8080"]
    depends_on:
      user-svc:
        condition: service_healthy
