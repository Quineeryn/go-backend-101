syntax = "proto3";

package user.v1;
option go_package = "github.com/Quineeryn/go-backend-101/pkg/proto/user/v1;userv1";

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  int64 created_at_unix = 4;
}

message GetUserRequest { string id = 1; }
message GetUserResponse { User user = 1; }

message CreateUserRequest { string email = 1; string name = 2; }
message CreateUserResponse { User user = 1; }

message ListUsersRequest { int32 page = 1; int32 page_size = 2; }
message ListUsersResponse { repeated User users = 1; }

service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
}
